<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobil Günlük Güvenlik Checklisti</title>
  <style>
    :root {
      --bg: #f4f7fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --ok: #0b7a45; --warn: #b45309; --bad: #b91c1c; --primary: #0f4c81; --border: #dbe3ee;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--text);
      background: linear-gradient(180deg, #eef3fb 0%, #f7f9fd 100%);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(15, 76, 129, 0.06);
      position: relative;
    }
    .counter-badge {
      position: absolute; top: 14px; right: 14px;
      background: var(--primary); color: #fff;
      padding: 4px 10px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700;
      box-shadow: 0 4px 10px rgba(15, 76, 129, 0.2);
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; color: var(--primary); padding-right: 80px; }
    h2 { font-size: 1rem; margin: 4px 0 10px; color: #0f172a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.86rem; color: #334155; margin-bottom: 4px; font-weight: 600; }
    input, select, textarea, button { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; min-height: 44px; font-size: 1rem; padding: 10px; background: #fff; }
    textarea { min-height: 70px; resize: vertical; }
    .item { border: 1px dashed #c7d2e5; border-radius: 12px; padding: 10px; margin-bottom: 10px; background: #fbfdff; }
    .item.passive { background: #f1f5f9; border-style: solid; opacity: 0.85; }
    .item-title { font-size: 0.94rem; font-weight: 600; margin: 0 0 8px; }
    .status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .status label { margin: 0; font-weight: 500; font-size: 0.82rem; text-align: center; border: 1px solid #cbd5e1; border-radius: 9px; padding: 7px 4px; background: #fff; cursor: pointer;}
    .status input { display: none; }
    .status input:checked + span { display: inline-block; width: 100%; color: #fff; border-radius: 7px; padding: 6px 2px; }
    .ok input:checked + span { background: var(--ok); }
    .warn input:checked + span { background: var(--warn); }
    .bad input:checked + span { background: var(--bad); }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-primary { background: var(--primary); color: #fff; border: 0; font-weight: 600; cursor: pointer; }
    .btn-ghost { background: #fff; color: #0f4c81; border: 1px solid #9fb7d7; font-weight: 600; cursor: pointer; }
    .btn-send { 
      background: #ff6a00; color: #ffffff; border: 2px solid #c2410c; 
      font-weight: 800; box-shadow: 0 8px 18px rgba(255, 106, 0, 0.35); 
      cursor: pointer; margin-top: 10px;
    }
    .sticky { position: sticky; bottom: 8px; z-index: 10; }
    .logo-box { width: 84px; height: 84px; border-radius: 12px; border: 1px solid #cbd5e1; background: #f8fbff; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-right: 10px;}
    .logo-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .footer-note { margin: 18px 0 10px; font-size: 0.82rem; color: #334155; text-align: center; font-weight: 600; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .btn-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="counter-badge">Toplam Rapor: <span id="reportCount">0</span></div>
      <h1>Mobil Günlük Güvenlik Checklisti</h1>
      <div style="display:flex; align-items:center;">
        <div class="logo-box" id="logoWrap">
          <img id="logoPreview" alt="Logo" />
          <span id="logoPlaceholder" style="font-size:0.6rem; color:#64748b;">Logo Seç</span>
        </div>
        <div style="flex:1;">
          <label for="rol">Kontrol Eden Rol</label>
          <select id="rol">
            <option value="Isveren">İşveren/İşveren Vekili</option>
            <option value="Calisan">Çalışan</option>
            <option value="Nobetci">Nöbetçi Öğretmen</option>
          </select>
        </div>
      </div>
      <input id="logoInput" type="file" accept="image/*" style="display:none;" />
      <div style="margin-top:10px; display:flex; gap:5px;">
        <button class="btn-ghost" style="min-height:30px; font-size:0.75rem;" onclick="document.getElementById('logoInput').click()">Logo Yükle</button>
        <button class="btn-ghost" style="min-height:30px; font-size:0.75rem;" id="removeLogoBtn">Logoyu Sil</button>
      </div>
    </div>

    <div class="card">
      <h2>Genel Bilgiler</h2>
      <div class="grid">
        <div><label for="okul">Okul Adı</label><input id="okul" placeholder="Örn: Atatürk İlkokulu" /></div>
        <div><label for="tarih">Tarih</label><input id="tarih" type="date" /></div>
        <div>
          <label for="tur">Kontrol Turu</label>
          <select id="tur">
            <option>1. Tur (Ders Başlangıcı)</option>
            <option>2. Tur (Öğle/İkindi)</option>
          </select>
        </div>
        <div><label for="ad">Kontrol Eden Ad Soyad</label><input id="ad" placeholder="Ad Soyad" /></div>
        <div><label for="saat">Saat</label><input id="saat" type="time" /></div>
      </div>
    </div>

    <div id="list-area"></div>

    <div class="card sticky">
      <div class="btn-row">
        <button class="btn-primary" id="saveBtn">Kaydet</button>
        <button class="btn-ghost" id="csvBtn">Excel/CSV İndir</button>
        <button class="btn-ghost" id="copyBtn">Özeti Kopyala</button>
        <button class="btn-ghost" id="resetBtn">Sıfırla</button>
      </div>
      <button class="btn-send" id="sendBtn">Raporu Gönder (Tüm Seçenekler)</button>
      <p id="msg" style="font-size:0.85rem; color:var(--primary); text-align:center; margin-top:8px; font-weight:600;"></p>
    </div>

    <p class="footer-note">BAŞÖĞRETMEN MUZAFFER ÇINAR - İSG UZMANI & TSE TETKİK GÖREVLİSİ</p>
  </div>

  <script>
    const checklist = [
      { id: "A1", text: "Koridor ve merdivenlerde yığılma kontrolü yapıldı" },
      { id: "A2", text: "Teneffüste riskli öğrenci davranışları gözlenmedi" },
      { id: "A3", text: "Acil çıkış ve tahliye güzergahları açık" },
      { id: "B1", text: "Giriş-çıkış ve ziyaretçi kayıt protokolü uygun" },
      { id: "B2", text: "Yönlendirme levhaları ve acil çıkış ışıkları çalışır durumda" },
      { id: "B3", text: "Tespit edilen anlık risklere müdahale edildi" },
      { id: "B4", text: "Ziyaretçi kimlik doğrulama işlemleri yapıldı" },
      { id: "B5", text: "Geç gelen/erken ayrılan öğrenci takibi yapıldı" },
      { id: "B6", text: "Öğrenci teslimatı yetkili kişilere yapıldı" },
      { id: "C1", text: "Islak zemin uyarı levhaları görünür şekilde yerleştirildi" },
      { id: "C2", text: "Okul bahçesinde tehlikeli yabancı nesne kontrolü yapıldı" },
      { id: "C3", text: "Tuvalet ve ortak alan hijyen-güvenlik kontrolü tamam" },
      { id: "C4", text: "Okul bahçesi araç girişine kapatıldı / fiziksel engel kontrol edildi" }
    ];

    const key = "isg_mobil_data_2026";
    const logoKey = "isg_app_logo";
    const counterKey = "isg_report_counter";

    function todayIso() { const d = new Date(); return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0, 10); }
    function message(t) { document.getElementById("msg").textContent = t; setTimeout(() => document.getElementById("msg").textContent = "", 3000); }

    function updateCounterUI() {
      const count = localStorage.getItem(counterKey) || 0;
      document.getElementById("reportCount").textContent = count;
    }

    function incrementCounter() {
      let count = parseInt(localStorage.getItem(counterKey) || 0);
      count++;
      localStorage.setItem(counterKey, count);
      updateCounterUI();
      return count;
    }

    function renderList() {
      const area = document.getElementById("list-area");
      area.innerHTML = "<h2>Kontrol Maddeleri</h2>";
      checklist.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.id = `item_${item.id}`;
        div.innerHTML = `
          <p class="item-title">${item.id} - ${item.text}</p>
          <div class="status">
            <label class="ok"><input type="radio" name="st_${item.id}" value="Uygun"><span>Uygun</span></label>
            <label class="warn"><input type="radio" name="st_${item.id}" value="Gözlem"><span>Gözlem</span></label>
            <label class="bad"><input type="radio" name="st_${item.id}" value="Uygun Değil"><span>Uygun Değil</span></label>
          </div>
          <textarea id="not_${item.id}" placeholder="Varsa aksiyon notunuzu yazın..."></textarea>
        `;
        area.appendChild(div);
      });
      applyRolePermissions();
    }

    function applyRolePermissions() {
      const role = document.getElementById("rol").value;
      const passiveIds = role === "Calisan" ? ["B4", "B5", "B6"] : [];
      checklist.forEach(item => {
        const isPassive = passiveIds.includes(item.id);
        const box = document.getElementById(`item_${item.id}`);
        box.classList.toggle("passive", isPassive);
        box.querySelectorAll("input, textarea").forEach(el => el.disabled = isPassive);
      });
    }

    function collect() {
      const meta = {
        okul: document.getElementById("okul").value,
        tarih: document.getElementById("tarih").value,
        tur: document.getElementById("tur").value,
        rol: document.getElementById("rol").options[document.getElementById("rol").selectedIndex].text,
        ad: document.getElementById("ad").value,
        saat: document.getElementById("saat").value
      };
      const rows = checklist.map(item => ({
        id: item.id,
        madde: item.text,
        durum: document.querySelector(`input[name=st_${item.id}]:checked`)?.value || "İşaretlenmedi",
        not: document.getElementById(`not_${item.id}`).value
      }));
      return { meta, rows };
    }

    function buildSummary(currentCount) {
      const data = collect();
      const total = data.rows.length;
      const ok = data.rows.filter(x => x.durum === "Uygun").length;
      const bad = data.rows.filter(x => x.durum === "Uygun Değil").length;
      const warn = data.rows.filter(x => x.durum === "Gözlem").length;
      const actions = data.rows.filter(x => x.durum === "Uygun Değil" || x.durum === "Gözlem");

      let text = `📋 *GÜNLÜK GÜVENLİK KONTROL RAPORU*\n`;
      text += `--------------------------------\n`;
      text += `🏫 *Okul:* ${data.meta.okul || "-"}\n`;
      text += `👤 *Kontrol Eden:* ${data.meta.ad || "-"}\n`;
      text += `🎭 *Rol:* ${data.meta.rol}\n`;
      text += `🔄 *Tur:* ${data.meta.tur}\n`;
      text += `📅 *Tarih:* ${data.meta.tarih} | *Saat:* ${data.meta.saat || "-"}\n`;
      text += `--------------------------------\n`;
      text += `✅ *Uygun:* ${ok}/${total} | ⚠️ *Gözlem:* ${warn} | ❌ *U.Değil:* ${bad}\n`;
      text += `--------------------------------\n`;

      if (actions.length > 0) {
        text += `🚀 *AKSİYON GEREKTİRENLER:*\n`;
        actions.forEach(item => {
          text += `\n📍 *${item.id}:* ${item.madde}\n`;
          text += `   - *Durum:* ${item.durum}\n`;
          text += `   - *Not:* ${item.not || "Açıklama girilmedi."}\n`;
        });
      } else {
        text += `✨ *Tüm kontroller uygun görülmüştür.*`;
      }
      
      // CIHAZ SAYAÇ NOTU EKLEME
      const totalCount = currentCount || localStorage.getItem(counterKey) || 0;
      text += `\n--------------------------------\n`;
      text += `📊 *[Sistem Notu: Bu cihazdan gönderilen toplam ${totalCount}. rapordur]*`;
      
      return text;
    }

    document.getElementById("sendBtn").onclick = async () => {
        const count = incrementCounter(); // Gönderince sayacı artır
        const text = buildSummary(count);
        const data = collect();
        const title = `${data.meta.okul} Güvenlik Raporu - ${data.meta.tarih}`;

        if (navigator.share) {
            try {
                await navigator.share({ title: title, text: text });
                message("Paylaşım menüsü açıldı.");
            } catch (err) {
                if (err.name !== "AbortError") message("Paylaşım sırasında bir hata oluştu.");
            }
        } else {
            navigator.clipboard.writeText(text);
            message("Tarayıcı paylaşımı desteklemiyor. Rapor kopyalandı!");
        }
    };

    document.getElementById("csvBtn").onclick = () => {
      const data = collect();
      const head = ["Tarih", "Tur", "Rol", "Kontrol Eden", "Saat", "Okul", "Madde No", "Durum", "Not"];
      const lines = [head.map(h => `"${h}"`).join(",")];
      data.rows.forEach(r => {
        lines.push([data.meta.tarih, data.meta.tur, data.meta.rol, data.meta.ad, data.meta.saat, data.meta.okul, r.id, r.durum, r.not].map(v => `"${v}"`).join(","));
      });
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = `Kontrol_Raporu_${data.meta.tarih}.csv`; a.click();
      incrementCounter();
    };

    document.getElementById("saveBtn").onclick = () => { 
        localStorage.setItem(key, JSON.stringify(collect())); 
        incrementCounter();
        message("Cihaza Kaydedildi."); 
    };
    
    document.getElementById("copyBtn").onclick = () => { 
        const count = incrementCounter();
        const summary = buildSummary(count);
        navigator.clipboard.writeText(summary).then(() => {
            message("Özet kopyalandı.");
        });
    };

    document.getElementById("resetBtn").onclick = function() {
        if(confirm("Tüm formu sıfırlamak istiyor musunuz? (DİKKAT: TOPLAM SAYAÇ SIFIRLANMAZ)")) {
            localStorage.removeItem(key);
            document.getElementById("ad").value = "";
            document.getElementById("saat").value = "";
            document.querySelectorAll('input[type="radio"]').forEach(radio => radio.checked = false);
            document.querySelectorAll('textarea').forEach(txt => txt.value = "");
            document.getElementById("tarih").value = todayIso();
            message("Form temizlendi.");
            setTimeout(() => location.reload(), 800);
        }
    };

    document.getElementById("logoInput").onchange = (e) => {
      const reader = new FileReader();
      reader.onload = () => { 
        document.getElementById("logoPreview").src = reader.result; 
        document.getElementById("logoPreview").style.display="block"; 
        document.getElementById("logoPlaceholder").style.display="none"; 
        localStorage.setItem(logoKey, reader.result);
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById("removeLogoBtn").onclick = () => { 
        if(confirm("Logoyu silmek istiyor musunuz?")) {
            localStorage.removeItem(logoKey); 
            location.reload(); 
        }
    };

    window.onload = () => {
      renderList();
      updateCounterUI();
      document.getElementById("tarih").value = todayIso();
      const savedLogo = localStorage.getItem(logoKey);
      if(savedLogo) { 
          document.getElementById("logoPreview").src = savedLogo; 
          document.getElementById("logoPreview").style.display="block"; 
          document.getElementById("logoPlaceholder").style.display="none"; 
      }
      const savedData = JSON.parse(localStorage.getItem(key));
      if(savedData) {
        document.getElementById("okul").value = savedData.meta.okul || "";
        document.getElementById("ad").value = savedData.meta.ad || "";
        document.getElementById("saat").value = savedData.meta.saat || "";
      }
    };
  </script>
</body>
</html>
