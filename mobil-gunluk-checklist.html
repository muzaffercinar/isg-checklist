<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İSG Premium Kontrol Formu</title>
  <style>
    :root {
      --bg: #f3f4f6; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --ok: #10b981; --warn: #f59e0b; --bad: #ef4444; --primary: #0f4c81; --border: #e2e8f0;
      --accent: #f97316; --gold: #d4af37;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); line-height: 1.5;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 10px; }
    
    /* PREMİUM KOMPAKT BAŞLIK ALANI */
    .premium-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    
    .header-left { display: flex; align-items: center; gap: 15px; }
    
    .logo-container {
      width: 50px; height: 50px;
      background: white; border-radius: 10px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      cursor: pointer; position: relative; overflow: hidden;
    }
    .logo-container img { width: 90%; height: 90%; object-fit: contain; }
    .logo-container span { font-size: 0.5rem; font-weight: 800; color: var(--muted); text-align: center; }

    .title-area { text-align: left; }
    .title-area h1 { 
      font-size: 0.95rem; margin: 0; color: var(--primary); 
      letter-spacing: 0.5px; text-transform: uppercase; font-weight: 800;
    }
    .report-status {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(15, 76, 129, 0.05); color: var(--primary);
      padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; margin-top: 2px;
    }

    .header-right { text-align: right; }
    .role-select-box { border: none; background: transparent; color: var(--primary); font-weight: 800; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; padding: 5px; }

    /* GENEL KART TASARIMI */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    h2 { font-size: 0.85rem; margin: 0 0 12px; color: var(--primary); font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    h2::before { content: ""; width: 3px; height: 12px; background: var(--accent); border-radius: 2px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 4px; font-weight: 800; text-transform: uppercase; }
    
    select, input, textarea { 
      width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 38px; 
      font-size: 0.85rem; padding: 8px 12px; background: #fcfcfc; color: var(--text);
    }
    select optgroup { font-weight: 800; color: var(--primary); }

    /* KONTROL MADDELERİ */
    .item { border: 1px solid #f1f5f9; border-radius: 10px; padding: 12px; margin-bottom: 8px; background: #fff; border-left: 4px solid var(--border); }
    .item-title { font-size: 0.8rem; font-weight: 700; margin: 0 0 8px; color: #334155; }
    .status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .status label { 
        margin: 0; font-size: 0.65rem; text-align: center; border: 1px solid #e2e8f0; 
        border-radius: 6px; padding: 6px 2px; background: #fff; cursor: pointer; color: #94a3b8;
    }
    .status input { display: none; }
    .ok input:checked + label { border-color: var(--ok); background: #ecfdf5; color: var(--ok); }
    .warn input:checked + label { border-color: var(--warn); background: #fffbeb; color: var(--warn); }
    .bad input:checked + label { border-color: var(--bad); background: #fef2f2; color: var(--bad); }

    .sticky { position: sticky; bottom: 10px; z-index: 10; padding: 12px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 14px; border: 1px solid rgba(15, 76, 129, 0.1); }
    .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .btn-icon { background: white; border: 1px solid var(--border); border-radius: 8px; font-size: 0.7rem; font-weight: 700; height: 40px; cursor: pointer; }
    .btn-send { width: 100%; background: var(--primary); color: #fff; border: 0; font-weight: 800; border-radius: 10px; height: 48px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    
    .footer-note { margin: 20px 0; font-size: 0.6rem; color: #94a3b8; text-align: center; font-weight: 800; text-transform: uppercase; }

    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    
    <div class="premium-header">
      <div class="header-left">
        <div class="logo-container" onclick="document.getElementById('logoInput').click()">
          <img id="logoPreview" style="display:none;" />
          <span id="logoPlaceholder">LOGO</span>
        </div>
        <div class="title-area">
          <h1>Güvenlik Kontrol Formu</h1>
          <div class="report-status">
             <span>ID: #<span id="reportCount">0</span></span>
             <span style="opacity: 0.3">|</span>
             <span id="removeLogoBtn" style="cursor:pointer; color:var(--bad)"> LOGOYU SİL</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <label style="margin:0; font-size:0.55rem;">YETKİ / ROL</label>
        <select id="rol" class="role-select-box">
          <option value="">SEÇİNİZ</option>
          <option value="Isveren">İŞVEREN VEKİLİ</option>
          <option value="Calisan">TEMSİLCİ</option>
          <option value="Nobetci">NÖBETÇİ</option>
        </select>
      </div>
      <input id="logoInput" type="file" accept="image/*" style="display:none;" />
    </div>

    <div class="card">
      <h2>Genel Bilgiler</h2>
      <div class="grid">
        <div style="grid-column: 1 / -1;">
          <label class="required">İç Kontrol / Resmi Kurum</label>
          <select id="okul">
            <option value="">Kurum seçiniz...</option>
            <optgroup label="✨ KARABURUN KURUMLARI">
              <option>Karaburun İlçe Milli Eğitim Müdürlüğü</option>
              <option>Karaburun Anaokulu</option>
              <option>Mordoğan SNÜ Anaokulu</option>
              <option>Karaburun İlkokulu</option>
              <option>Atatürk İlkokulu</option>
              <option>Karaburun Ortaokulu</option>
              <option>Atatürk Ortaokulu</option>
              <option>Karaburun Çok Programlı Anadolu Lisesi</option>
              <option>Mordoğan Fatma Emin Karaağaç Çok Programlı Anadolu Lisesi</option>
              <option>Karaburun İmam Hatip Lisesi</option>
              <option>Karaburun HEM</option>
              <option>Karaburun Öğr. Evi ve ASO</option>
            </optgroup>
            <optgroup label="✨ GÜZELBAHÇE KURUMLARI">
              <option>Güzelbahçe İlçe Milli Eğitim Müdürlüğü</option>
              <option>Güzelbahçe Halk Eğitimi Merkezi</option>
              <option>Güzelbahçe Anaokulu</option>
              <option>Vali Kazım Paşa İlkokulu</option>
              <option>Yelki Hamdi Dalan İlkokulu</option>
              <option>Hakkı Oğuz Tabaoğlu İlkokulu</option>
              <option>Ali Bayırlar İlkokulu</option>
              <option>Mustafa-Saadet Alanyalıoğlu İlkokulu</option>
              <option>Payamlı İlkokulu</option>
              <option>Vali Kazım Paşa Ortaokulu</option>
              <option>Namık Elal Ortaokulu</option>
              <option>Dr. Güngör Özbek Ortaokulu</option>
              <option>Ali Bayırlar Ortaokulu</option>
              <option>Mustafa-Saadet Alanyalıoğlu Ortaokulu</option>
              <option>60. Yıl Anadolu Lisesi</option>
              <option>Cengiz Topel Anadolu Lisesi</option>
              <option>Borsa İstanbul Mesleki ve Teknik Anadolu Lisesi</option>
              <option>Dr. Güngör Özbek Anadolu Lisesi</option>
              <option>Şehit Abdullah Tayyip Olçak Anadolu İmam Hatip Lisesi</option>
              <option>Yaşar Eğitim ve Kültür Vakfı Özel Eğitim İş Uygulama Merkezi</option>
            </optgroup>
          </select>
        </div>
        <div><label>Ad Soyad</label><input id="ad" placeholder="..." /></div>
        <div><label>Kontrol Saati</label><input id="saat" type="time" /></div>
        <div style="display:none;"><input id="tarih" type="date" /></div>
        <div style="display:none;"><select id="tur"><option>1. Tur</option></select></div>
      </div>
    </div>

    <div id="list-area"></div>

    <div class="sticky">
      <div class="btn-row">
        <button class="btn-icon" id="saveBtn">💾 KAYDET</button>
        <button class="btn-icon" id="copyBtn">📋 KOPYALA</button>
        <button class="btn-icon" id="csvBtn">📊 EXCEL</button>
        <button class="btn-icon" id="resetBtn" style="color:var(--bad);">🧹 SIFIRLA</button>
      </div>
      <button class="btn-send" id="sendBtn">RAPORU GÖNDER</button>
      <p id="msg" style="font-size:0.6rem; text-align:center; margin-top:5px; font-weight:800; min-height:10px;"></p>
    </div>

    <p class="footer-note">İSG UZMANI & TSE TETKİK GÖREVLİSİ</p>
  </div>

  <script>
    const checklist = [
      { id: "A1", text: "Koridor ve merdivenlerde yığılma kontrolü" },
      { id: "A2", text: "Riskli öğrenci davranışları gözlemi" },
      { id: "A3", text: "Acil çıkış ve tahliye güzergahları" },
      { id: "B1", text: "Ziyaretçi kayıt ve protokol uygunluğu" },
      { id: "B2", text: "Levha ve acil çıkış aydınlatmaları" },
      { id: "C1", text: "Islak zemin uyarı ve güvenlik önlemleri" },
      { id: "C2", text: "Bahçe ve çevre güvenlik kontrolü" }
    ];

    const key = "isg_mobil_v3";
    const logoKey = "isg_logo_v3";
    const counterKey = "isg_count_v3";

    function todayIso() { return new Date().toISOString().slice(0, 10); }
    function message(t, isErr = true) { 
        const el = document.getElementById("msg");
        el.textContent = t; el.style.color = isErr ? "var(--bad)" : "var(--primary)";
        setTimeout(() => el.textContent = "", 3000); 
    }

    function renderList() {
      const area = document.getElementById("list-area");
      area.innerHTML = "<h2>Kontrol Maddeleri</h2>";
      checklist.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <p class="item-title">${item.id} - ${item.text}</p>
          <div class="status">
            <div class="ok"><input type="radio" name="st_${item.id}" id="ok_${item.id}" value="Uygun"><label for="ok_${item.id}">UYGUN</label></div>
            <div class="warn"><input type="radio" name="st_${item.id}" id="wr_${item.id}" value="GÖZLEM"><label for="wr_${item.id}">GÖZLEM</label></div>
            <div class="bad"><input type="radio" name="st_${item.id}" id="bd_${item.id}" value="U. DEĞİL"><label for="bd_${item.id}">U. DEĞİL</label></div>
          </div>
          <textarea id="not_${item.id}" style="margin-top:8px; min-height:30px; font-size:0.75rem;" placeholder="Not..."></textarea>
        `;
        area.appendChild(div);
      });
    }

    document.getElementById("logoInput").onchange = (e) => {
      const reader = new FileReader();
      reader.onload = () => { 
        document.getElementById("logoPreview").src = reader.result; 
        document.getElementById("logoPreview").style.display="block"; 
        document.getElementById("logoPlaceholder").style.display="none"; 
        localStorage.setItem(logoKey, reader.result);
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById("removeLogoBtn").onclick = () => {
        localStorage.removeItem(logoKey);
        location.reload();
    };

    document.getElementById("sendBtn").onclick = () => {
        let count = parseInt(localStorage.getItem(counterKey) || 0) + 1;
        localStorage.setItem(counterKey, count);
        document.getElementById("reportCount").textContent = count;
        message("Rapor Paylaşıldı!", false);
    };

    window.onload = () => {
      renderList();
      document.getElementById("tarih").value = todayIso();
      document.getElementById("reportCount").textContent = localStorage.getItem(counterKey) || 0;
      const savedLogo = localStorage.getItem(logoKey);
      if(savedLogo) { 
          document.getElementById("logoPreview").src = savedLogo; 
          document.getElementById("logoPreview").style.display="block"; 
          document.getElementById("logoPlaceholder").style.display="none"; 
      }
    };
  </script>
</body>
</html>
