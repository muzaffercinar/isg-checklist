<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurum İçi Günlük Güvenlik Kontrol Formu</title>
  <style>
    :root {
      --bg: #f4f7fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --ok: #0b7a45; --warn: #b45309; --bad: #b91c1c; --primary: #0f4c81; --border: #dbe3ee;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif; color: var(--text);
      background: linear-gradient(180deg, #eef3fb 0%, #f7f9fd 100%);
      min-height: 100vh;
    }

    /* ŞİFRE EKRANI STİLLERİ */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--primary); display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .login-box {
      background: white; padding: 30px; border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center;
    }
    .login-box h2 { font-size: 1rem; color: var(--primary); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
    .login-box p { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; font-weight: 600; }
    .login-box input {
      width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;
      margin-bottom: 15px; font-size: 1rem; text-align: center;
    }
    .login-box button {
      width: 100%; padding: 12px; background: #ea580c; color: white;
      border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 1rem;
    }

    /* ANA İÇERIK (BAŞLANGIÇTA GİZLİ) */
    .wrap { max-width: 860px; margin: 0 auto; padding: 10px; display: none; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(15, 76, 129, 0.05);
      position: relative;
    }
    .counter-badge {
      position: absolute; top: -8px; right: 10px;
      background: #e11d48; color: #fff;
      padding: 2px 10px; border-radius: 12px;
      font-size: 0.7rem; font-weight: 800;
      box-shadow: 0 4px 8px rgba(225, 29, 72, 0.3);
      z-index: 5;
    }
    h1 { font-size: 1.05rem; margin: 0 0 12px; color: var(--primary); line-height: 1.3; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; font-weight: 800; }
    h2 { font-size: 0.95rem; margin: 0 0 10px; color: #0f172a; font-weight: 700; border-left: 3px solid var(--primary); padding-left: 8px; }
    
    .header-flex { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .logo-box { 
      width: 60px; height: 60px; min-width: 60px;
      border-radius: 10px; border: 1px dashed #cbd5e1; 
      background: #f8fbff; display: flex; align-items: center; justify-content: center; 
      overflow: hidden; cursor: pointer;
    }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; }
    .logo-box span { font-size: 0.55rem; color: #64748b; text-align: center; font-weight: 700; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 0.8rem; color: #475569; margin-bottom: 3px; font-weight: 700; }
    .required::after { content: " *"; color: #ef4444; }
    
    select, input, textarea { 
      width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; min-height: 40px; 
      font-size: 0.95rem; padding: 8px 12px; background: #fff; color: #1e293b;
    }
    select:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1); }
    
    select optgroup { font-style: normal; font-weight: 800; color: var(--primary); background: #f1f5f9; }
    
    .item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; background: #fff; }
    .item.passive { background: #f8fafc; opacity: 0.6; pointer-events: none; }
    .item-title { font-size: 0.9rem; font-weight: 700; margin: 0 0 10px; color: #1e293b; }
    
    .status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .status label { margin: 0; font-size: 0.75rem; text-align: center; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 2px; background: #f8fafc; cursor: pointer; color: #64748b; font-weight: 700;}
    .status input { display: none; }
    .status input:checked + span { display: inline-block; width: 100%; color: #fff; border-radius: 4px; padding: 4px 2px; font-weight: 800; }
    .ok input:checked + span { background: var(--ok); }
    .warn input:checked + span { background: var(--warn); }
    .bad input:checked + span { background: var(--bad); }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-primary { background: var(--primary); color: #fff; border: 0; font-weight: 700; cursor: pointer; border-radius: 8px; }
    .btn-ghost { background: #fff; color: var(--primary); border: 1px solid #cbd5e1; font-weight: 700; cursor: pointer; font-size: 0.85rem; border-radius: 8px; }
    .btn-send { background: #ea580c; color: #fff; border: 0; font-weight: 800; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); cursor: pointer; margin-top: 10px; border-radius: 8px; font-size: 1rem; height: 48px; width: 100%; }
    
    .sticky { position: sticky; bottom: 8px; z-index: 10; padding: 12px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--primary); border-radius: 12px; }
    .footer-note { margin: 20px 0; font-size: 0.75rem; color: #64748b; text-align: center; font-weight: 800; line-height: 1.5; text-transform: uppercase; }

    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>OKUL GÜVENLİĞİ GÜNLÜK TAKİP SİSTEMİ</h2>
      <p>GİRİŞ</p>
      <input type="password" id="passInput" placeholder="Şifre Giriniz" onkeypress="if(event.key==='Enter') checkPassword()">
      <button onclick="checkPassword()">SİSTEMİ AÇ</button>
      <p id="error-msg" style="color:#b91c1c; font-size:0.8rem; margin-top:10px; display:none; font-weight:bold;">⚠️ Hatalı Şifre!</p>
    </div>
  </div>

  <div class="wrap" id="main-content">
    <div class="card">
      <div class="counter-badge">TOPLAM: <span id="reportCount">0</span></div>
      <h1>Kurum İçi Günlük Güvenlik Kontrol Formu</h1>
      
      <div class="header-flex">
        <div class="logo-box" onclick="document.getElementById('logoInput').click()">
          <img id="logoPreview" style="display:none;" />
          <span id="logoPlaceholder">LOGO<br>YÜKLE</span>
        </div>
        <div style="flex:1;">
          <label for="rol" class="required">Kontrol Eden Rol</label>
          <select id="rol">
            <option value="">Seçiniz...</option>
            <option value="Isveren">İşveren / İşveren Vekili</option>
            <option value="Calisan">Çalışan</option>
            <option value="Nobetci">Nöbetçi Öğretmen</option>
          </select>
          <div style="margin-top:6px;">
             <span style="font-size:0.65rem; color:var(--primary); cursor:pointer; text-decoration:underline; font-weight:800;" id="removeLogoBtn">Logoyu Kaldır</span>
          </div>
        </div>
      </div>
      <input id="logoInput" type="file" accept="image/*" style="display:none;" />
    </div>

    <div class="card">
      <h2>Genel Bilgiler</h2>
      <div class="grid">
        <div style="grid-column: 1 / -1;">
          <label for="okul" class="required">Resmi Kurum Seçimi</label>
          <select id="okul">
            <option value="">Lütfen listeden seçiniz...</option>
            <optgroup label="✨ KARABURUN KURUMLARI">
              <option>Karaburun İlçe Milli Eğitim Müdürlüğü</option>
              <option>Karaburun Anaokulu</option>
              <option>Mordoğan SNÜ Anaokulu</option>
              <option>Karaburun İlkokulu</option>
              <option>Atatürk İlkokulu</option>
              <option>Karaburun Ortaokulu</option>
              <option>Atatürk Ortaokulu</option>
              <option>Karaburun Çok Programlı Anadolu Lisesi</option>
              <option>Mordoğan Fatma Emin Karaağaç Çok Programlı Anadolu Lisesi</option>
              <option>Karaburun İmam Hatip Lisesi</option>
              <option>Karaburun HEM</option>
              <option>Karaburun Öğr. Evi ve ASO</option>
            </optgroup>
            <optgroup label="✨ GÜZELBAHÇE KURUMLARI">
              <option>Güzelbahçe İlçe Milli Eğitim Müdürlüğü</option>
              <option>Güzelbahçe Halk Eğitimi Merkezi</option>
              <option>Güzelbahçe Anaokulu</option>
              <option>Vali Kazım Paşa İlkokulu</option>
              <option>Yelki Hamdi Dalan İlkokulu</option>
              <option>Hakkı Oğuz Tabaoğlu İlkokulu</option>
              <option>Ali Bayırlar İlkokulu</option>
              <option>Mustafa-Saadet Alanyalıoğlu İlkokulu</option>
              <option>Payamlı İlkokulu</option>
              <option>Vali Kazım Paşa Ortaokulu</option>
              <option>Namık Elal Ortaokulu</option>
              <option>Dr. Güngör Özbek Ortaokulu</option>
              <option>Ali Bayırlar Ortaokulu</option>
              <option>Mustafa-Saadet Alanyalıoğlu Ortaokulu</option>
              <option>60. Yıl Anadolu Lisesi</option>
              <option>Cengiz Topel Anadolu Lisesi</option>
              <option>Borsa İstanbul Mesleki ve Teknik Anadolu Lisesi</option>
              <option>Dr. Güngör Özbek Anadolu Lisesi</option>
              <option>Şehit Abdullah Tayyip Olçak Anadolu İmam Hatip Lisesi</option>
              <option>Yaşar Eğitim ve Kültür Vakfı Özel Eğitim İş Uygulama Merkezi</option>
            </optgroup>
            <option value="LOCKED" style="color: #64748b; font-weight: bold;">🔒 DİĞER KURUMLAR (KİLİTLİ)</option>
          </select>
        </div>
        <div><label for="ad" class="required">Ad Soyad</label><input id="ad" placeholder="Adınızı yazınız..." /></div>
        <div><label for="saat" class="required">Kontrol Saati</label><input id="saat" type="time" /></div>
        <div><label for="tarih">Tarih</label><input id="tarih" type="date" /></div>
        <div>
          <label for="tur">Kontrol Turu</label>
          <select id="tur">
            <option>1. Tur (Sabah)</option>
            <option>2. Tur (Öğle)</option>
            <option>3. Tur (Akşam)</option>
          </select>
        </div>
      </div>
    </div>

    <div id="list-area"></div>

    <div class="card sticky">
      <div class="btn-row">
        <button class="btn-primary" id="saveBtn">Kaydet</button>
        <button class="btn-ghost" id="copyBtn">Kopyala</button>
        <button class="btn-ghost" id="csvBtn">Excel/CSV</button>
        <button class="btn-ghost" id="resetBtn" style="color:#b91c1c;">Formu Sıfırla</button>
      </div>
      <button class="btn-send" id="sendBtn">RAPORU PAYLAŞ / GÖNDER</button>
      <p id="msg" style="font-size:0.8rem; color:#b91c1c; text-align:center; margin-top:8px; font-weight:800; height:15px;"></p>
    </div>

    <p class="footer-note">BAŞÖĞRETMEN MUZAFFER ÇINAR<br>İSG UZMANI & TSE TETKİK GÖREVLİSİ</p>
  </div>

  <script>
    // ŞİFRE FONKSİYONU
    function checkPassword() {
      const p = document.getElementById("passInput").value;
      if(p === "isg2026Guvenlik") {
        document.getElementById("login-overlay").remove();
        document.getElementById("main-content").style.display = "block";
      } else {
        document.getElementById("error-msg").style.display = "block";
        document.getElementById("passInput").value = "";
      }
    }

    const checklist = [
      { id: "A1", text: "Koridor ve merdivenlerde yığılma kontrolü yapıldı" },
      { id: "A2", text: "Teneffüste riskli öğrenci davranışları gözlenmedi" },
      { id: "A3", text: "Acil çıkış ve tahliye güzergahları açık" },
      { id: "B1", text: "Giriş-çıkış ve ziyaretçi kayıt protokolü uygun" },
      { id: "B2", text: "Yönlendirme levhaları ve acil çıkış ışıkları çalışır durumda" },
      { id: "B3", text: "Tespit edilen anlık risklere müdahale edildi" },
      { id: "B4", text: "Ziyaretçi kimlik doğrulama işlemleri yapıldı" },
      { id: "B5", text: "Geç gelen/erken ayrılan öğrenci takibi yapıldı" },
      { id: "B6", text: "Öğrenci teslimatı yetkili kişilere yapıldı" },
      { id: "C1", text: "Islak zemin uyarı levhaları görünür şekilde yerleştirildi" },
      { id: "C2", text: "Okul bahçesinde tehlikeli yabancı nesne kontrolü yapıldı" },
      { id: "C3", text: "Tuvalet ve ortak alan hijyen-güvenlik kontrolü tamam" },
      { id: "C4", text: "Okul bahçesi araç girişine kapatıldı / fiziksel engel kontrol edildi" }
    ];

    const key = "isg_mobil_data_2026";
    const logoKey = "isg_app_logo";
    const counterKey = "isg_report_counter";

    function todayIso() { const d = new Date(); return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0, 10); }
    function message(t, isErr = true) { 
        const el = document.getElementById("msg");
        el.textContent = t;
        el.style.color = isErr ? "#ef4444" : "#0f4c81";
        setTimeout(() => el.textContent = "", 4000); 
    }

    document.getElementById("okul").onchange = function() {
        if(this.value === "LOCKED") {
            message("⛔ LİSANS AÇIK DEĞİL! Diğer kurumlar için yetkilendirme gereklidir.");
            this.value = "";
        }
    };

    function validateForm() {
        const rol = document.getElementById("rol").value;
        const okul = document.getElementById("okul").value;
        const ad = document.getElementById("ad").value.trim();
        const saat = document.getElementById("saat").value;
        if (!rol || !okul || !ad || !saat) {
            message("⚠️ Lütfen zorunlu alanları (*) doldurunuz!");
            return false;
        }
        return true;
    }

    function updateCounterUI() {
      const count = localStorage.getItem(counterKey) || 0;
      document.getElementById("reportCount").textContent = count;
    }

    function incrementCounter() {
      let count = parseInt(localStorage.getItem(counterKey) || 0);
      count++;
      localStorage.setItem(counterKey, count);
      updateCounterUI();
      return count;
    }

    function renderList() {
      const area = document.getElementById("list-area");
      area.innerHTML = "<h2>Kontrol Maddeleri</h2>";
      checklist.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.id = `item_${item.id}`;
        div.innerHTML = `
          <p class="item-title">${item.id} - ${item.text}</p>
          <div class="status">
            <label class="ok"><input type="radio" name="st_${item.id}" value="Uygun"><span>Uygun</span></label>
            <label class="warn"><input type="radio" name="st_${item.id}" value="Gözlem"><span>Gözlem</span></label>
            <label class="bad"><input type="radio" name="st_${item.id}" value="Uygun Değil"><span>U. Değil</span></label>
          </div>
          <textarea id="not_${item.id}" placeholder="Önemli notlarınızı buraya ekleyebilirsiniz..."></textarea>
        `;
        area.appendChild(div);
      });
      applyRolePermissions();
    }

    function applyRolePermissions() {
      const role = document.getElementById("rol").value;
      const passiveIds = role === "Calisan" ? ["B4", "B5", "B6"] : [];
      checklist.forEach(item => {
        const isPassive = passiveIds.includes(item.id);
        const box = document.getElementById(`item_${item.id}`);
        if(box) {
          box.classList.toggle("passive", isPassive);
          box.querySelectorAll("input, textarea").forEach(el => el.disabled = isPassive);
        }
      });
    }

    function collect() {
      const meta = {
        okul: document.getElementById("okul").value,
        tarih: document.getElementById("tarih").value,
        tur: document.getElementById("tur").value,
        rol: document.getElementById("rol").options[document.getElementById("rol").selectedIndex].text,
        ad: document.getElementById("ad").value,
        saat: document.getElementById("saat").value
      };
      const rows = checklist.map(item => ({
        id: item.id,
        madde: item.text,
        durum: document.querySelector(`input[name=st_${item.id}]:checked`)?.value || "İşaretlenmedi",
        not: document.getElementById(`not_${item.id}`).value
      }));
      return { meta, rows };
    }

    function buildSummary(currentCount) {
      const data = collect();
      const total = data.rows.length;
      const ok = data.rows.filter(x => x.durum === "Uygun").length;
      const bad = data.rows.filter(x => x.durum === "Uygun Değil").length;
      const warn = data.rows.filter(x => x.durum === "Gözlem").length;
      const actions = data.rows.filter(x => x.durum === "Uygun Değil" || x.durum === "Gözlem");

      let text = `📋 *GÜNLÜK GÜVENLİK KONTROL FORMU*\n`;
      text += `--------------------------------\n`;
      text += `🏫 *Kurum:* ${data.meta.okul}\n`;
      text += `👤 *Görevli:* ${data.meta.ad}\n`;
      text += `🎭 *Rol:* ${data.meta.rol}\n`;
      text += `🔄 *Tur:* ${data.meta.tur}\n`;
      text += `📅 *Tarih:* ${data.meta.tarih} | *Saat:* ${data.meta.saat}\n`;
      text += `--------------------------------\n`;
      text += `✅ Uygun: ${ok}/${total} | ⚠️ Gözlem: ${warn} | ❌ U.Değil: ${bad}\n`;
      text += `--------------------------------\n`;

      if (actions.length > 0) {
        text += `🚀 *AKSİYON GEREKTİRENLER:*\n`;
        actions.forEach(item => {
          text += `\n📍 *${item.id}:* ${item.madde}\n`;
          text += `   - Durum: ${item.durum}\n`;
          text += `   - Not: ${item.not || "Açıklama yok."}\n`;
        });
      } else {
        text += `✨ Tüm kontroller uygun görülmüştür.`;
      }
      
      const totalCount = currentCount || localStorage.getItem(counterKey) || 0;
      text += `\n--------------------------------\n`;
      text += `📊 [Sistem Notu: Toplam ${totalCount}. rapordur]`;
      
      return text;
    }

    document.getElementById("sendBtn").onclick = async () => {
        if(!validateForm()) return;
        const count = incrementCounter();
        const text = buildSummary(count);
        if (navigator.share) {
            try {
                await navigator.share({ title: "İSG Formu", text: text });
                message("Paylaşım menüsü açıldı.", false);
            } catch (err) {
                if (err.name !== "AbortError") message("Paylaşım yapılamadı.");
            }
        } else {
            navigator.clipboard.writeText(text);
            message("Kopyalandı!", false);
        }
    };

    document.getElementById("saveBtn").onclick = () => { 
        if(!validateForm()) return;
        localStorage.setItem(key, JSON.stringify(collect())); 
        incrementCounter();
        message("Cihaz hafızasına kaydedildi.", false); 
    };
    
    document.getElementById("copyBtn").onclick = () => { 
        if(!validateForm()) return;
        const count = incrementCounter();
        const summary = buildSummary(count);
        navigator.clipboard.writeText(summary).then(() => {
            message("Rapor kopyalandı.", false);
        });
    };

    document.getElementById("csvBtn").onclick = () => {
      if(!validateForm()) return;
      const data = collect();
      const head = ["Tarih", "Tur", "Rol", "Ad Soyad", "Saat", "Kurum", "Madde", "Durum", "Not"];
      const lines = [head.map(h => `"${h}"`).join(",")];
      data.rows.forEach(r => {
        lines.push([data.meta.tarih, data.meta.tur, data.meta.rol, data.meta.ad, data.meta.saat, data.meta.okul, r.id, r.durum, r.not].map(v => `"${v}"`).join(","));
      });
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ISG_Rapor_${data.meta.tarih}.csv`; a.click();
      incrementCounter();
    };

    document.getElementById("resetBtn").onclick = function() {
        if(confirm("Tüm formu sıfırlamak istiyor musunuz?")) {
            localStorage.removeItem(key);
            document.getElementById("ad").value = "";
            document.getElementById("saat").value = "";
            document.getElementById("okul").value = "";
            document.getElementById("rol").value = "";
            document.querySelectorAll('input[type="radio"]').forEach(radio => radio.checked = false);
            document.querySelectorAll('textarea').forEach(txt => txt.value = "");
            document.getElementById("tarih").value = todayIso();
            message("Form temizlendi.", false);
            setTimeout(() => location.reload(), 500);
        }
    };

    document.getElementById("logoInput").onchange = (e) => {
      const reader = new FileReader();
      reader.onload = () => { 
        document.getElementById("logoPreview").src = reader.result; 
        document.getElementById("logoPreview").style.display="block"; 
        document.getElementById("logoPlaceholder").style.display="none"; 
        localStorage.setItem(logoKey, reader.result);
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById("removeLogoBtn").onclick = () => { 
        if(confirm("Logoyu tamamen kaldırmak istiyor musunuz?")) {
            localStorage.removeItem(logoKey); 
            location.reload(); 
        }
    };

    document.getElementById("rol").onchange = applyRolePermissions;

    window.onload = () => {
      renderList();
      updateCounterUI();
      document.getElementById("tarih").value = todayIso();
      const savedLogo = localStorage.getItem(logoKey);
      if(savedLogo) { 
          document.getElementById("logoPreview").src = savedLogo; 
          document.getElementById("logoPreview").style.display="block"; 
          document.getElementById("logoPlaceholder").style.display="none"; 
      }
      const savedData = JSON.parse(localStorage.getItem(key));
      if(savedData) {
        document.getElementById("okul").value = savedData.meta.okul || "";
        document.getElementById("ad").value = savedData.meta.ad || "";
        document.getElementById("saat").value = savedData.meta.saat || "";
        if(savedData.meta.rol === "İşveren / İşveren Vekili") document.getElementById("rol").value = "Isveren";
        else if(savedData.meta.rol === "Çalışan") document.getElementById("rol").value = "Calisan";
        else if(savedData.meta.rol === "Nöbetçi Öğretmen") document.getElementById("rol").value = "Nobetci";
        applyRolePermissions();
      }
    };
  </script>
</body>
</html>
