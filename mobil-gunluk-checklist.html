<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İSG Kontrol Formu</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --ok: #10b981; --warn: #f59e0b; --bad: #ef4444; --primary: #0f4c81; --border: #e2e8f0;
      --accent: #f97316;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: "Inter", system-ui, sans-serif; color: var(--text);
      background: #f1f5f9; line-height: 1.5;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 12px; padding-bottom: 150px; }
    
    /* HEADER */
    .header-card {
      background: var(--card); border-radius: 16px;
      padding: 20px 16px; margin-bottom: 12px; 
      box-shadow: 0 10px 25px rgba(15, 76, 129, 0.05);
      text-align: center; border: 1px solid var(--border);
    }
    .report-no {
      display: inline-block; background: #f1f5f9; color: var(--primary);
      padding: 2px 10px; border-radius: 12px; font-size: 0.65rem;
      font-weight: 800; margin-bottom: 8px; border: 1px solid var(--border);
    }
    h1 { 
      font-size: 1.1rem; margin: 0; color: var(--primary); 
      letter-spacing: 0.3px; text-transform: uppercase; font-weight: 800;
    }
    .title-line {
      width: 40px; height: 3px; background: var(--accent); margin: 10px auto 0; border-radius: 2px;
    }

    .header-flex { display: flex; align-items: center; gap: 12px; margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 15px; }
    .logo-box { 
      width: 64px; height: 64px; min-width: 64px;
      border-radius: 10px; border: 2px dashed #cbd5e1; 
      background: #f8fafc; display: flex; align-items: center; justify-content: center; 
      overflow: hidden; cursor: pointer;
    }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; }
    .logo-box span { font-size: 0.55rem; color: #64748b; text-align: center; font-weight: 700; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    h2 { font-size: 0.9rem; margin: 0 0 12px; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    h2::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; }
    .required::after { content: " *"; color: var(--bad); }
    
    select, input, textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; min-height: 40px; font-size: 0.9rem; padding: 8px 12px; }

    /* LİSANS UYARISI - TIKLANABİLİR */
    #license-lock {
      display: none; background: #fff; border: 2px dashed var(--bad); 
      border-radius: 16px; padding: 40px 20px; text-align: center;
      cursor: pointer; transition: 0.3s; margin-top: 20px;
    }
    #license-lock:active { transform: scale(0.98); background: #fef2f2; }
    #license-lock h3 { color: var(--bad); margin: 0 0 10px; font-weight: 900; }
    #license-lock p { font-size: 0.85rem; color: var(--muted); margin: 0; font-weight: 700; }

    /* MADDELER */
    .item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #fff; }
    .item-title { font-size: 0.85rem; font-weight: 700; margin: 0 0 10px; color: #334155; }
    
    .status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .status label { 
        margin: 0; font-size: 0.7rem; text-align: center; border: 1px solid #e2e8f0; 
        border-radius: 6px; padding: 8px 2px; background: #fff; cursor: pointer; 
        color: #94a3b8; font-weight: 700;
    }
    .status input { display: none; }
    .st-ok:checked + label { border-color: var(--ok); background: #ecfdf5; color: var(--ok); }
    .st-wr:checked + label { border-color: var(--warn); background: #fffbeb; color: var(--warn); }
    .st-bd:checked + label { border-color: var(--bad); background: #fef2f2; color: var(--bad); }

    .sticky { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 820px; z-index: 100; padding: 12px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 14px; border: 1px solid rgba(15, 76, 129, 0.1); box-shadow: 0 -5px 25px rgba(0,0,0,0.1); }
    .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .btn-primary { background: var(--primary); color: #fff; border: 0; font-weight: 700; cursor: pointer; border-radius: 8px; min-height: 44px; font-size: 0.6rem; }
    .btn-ghost { background: #fff; color: var(--primary); border: 1px solid #d1d5db; font-weight: 700; cursor: pointer; font-size: 0.6rem; border-radius: 8px; min-height: 44px; }
    .btn-send { width: 100%; background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); color: #fff; border: 0; font-weight: 800; text-transform: uppercase; border-radius: 10px; font-size: 0.95rem; min-height: 52px; cursor: pointer; }
    
    .footer-note { margin: 25px 0; font-size: 0.65rem; color: #94a3b8; text-align: center; font-weight: 800; text-transform: uppercase; }

    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .btn-row { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    
    <div class="header-card">
      <div class="report-no">RAPOR NO: <span id="reportCount">0</span></div>
      <h1>Günlük Güvenlik Kontrol Formu</h1>
      <div class="title-line"></div>
      
      <div class="header-flex">
        <div class="logo-box" onclick="document.getElementById('logoInput').click()">
          <img id="logoPreview" style="display:none;" />
          <span id="logoPlaceholder">LOGO<br>YÜKLE</span>
        </div>
        <div style="flex:1; text-align: left;">
          <label for="rol" class="required">Yetki / Rol</label>
          <select id="rol">
            <option value="">Seçiniz...</option>
            <option value="Isveren">İşveren / İşveren Vekili</option>
            <option value="Calisan">Çalışan Temsilcisi</option>
            <option value="Nobetci">Nöbetçi Öğretmen</option>
          </select>
          <span style="font-size:0.6rem; color:var(--bad); cursor:pointer; font-weight:700; margin-top:4px; display:block;" onclick="removeLogo()">✖ Logoyu Kaldır</span>
        </div>
      </div>
      <input id="logoInput" type="file" accept="image/*" style="display:none;" />
    </div>

    <div class="card">
      <h2>Genel Bilgiler</h2>
      <div class="grid">
        <div style="grid-column: 1 / -1;">
          <label for="okul" class="required">İç Kontrol / Resmi Kurum</label>
          <select id="okul" onchange="checkLicense()">
            <option value="">Kurum seçiniz...</option>
            <optgroup label="✨ AKTİF KURUMLAR">
              <option>Karaburun İlkokulu</option>
              <option>60. Yıl Anadolu Lisesi</option>
            </optgroup>
            <option value="LOCKED">🔒 Diğer Kurumlar (Lisans Gerekli)</option>
          </select>
        </div>
        <div><label for="ad" class="required">Ad Soyad</label><input id="ad" placeholder="..." /></div>
        <div><label for="saat" class="required">Saat</label><input id="saat" type="time" /></div>
        <div><label for="tarih">Tarih</label><input id="tarih" type="date" /></div>
        <div><label>Kontrol Turu</label><select id="tur"><option>1. Tur</option><option>2. Tur</option><option>3. Tur</option></select></div>
      </div>
    </div>

    <div id="license-lock" onclick="getLicenseInfo()">
      <h3>⚠️ LİSANS AKTİF DEĞİL</h3>
      <p>Bu kurumun kontrol listesine erişmek için<br><b>LİSANS ANAHTARI EDİNİNİZ</b></p>
      <span style="display:inline-block; margin-top:15px; padding:6px 12px; background:var(--bad); color:#fff; border-radius:6px; font-size:0.7rem; font-weight:800;">BİLGİ ALMAK İÇİN TIKLA</span>
    </div>

    <div id="list-area"></div>

    <div class="sticky">
      <div class="btn-row">
        <button class="btn-primary" onclick="saveData()">💾 Kaydet</button>
        <button class="btn-ghost" onclick="copyToClipboard()">📋 Kopyala</button>
        <button class="btn-ghost" onclick="exportCSV()">📊 Excel</button>
        <button class="btn-ghost" onclick="resetForm()" style="color:var(--bad);">🧹 Sıfırla</button>
      </div>
      <button class="btn-send" onclick="shareReport()">RAPORU PAYLAŞ / GÖNDER</button>
      <p id="msg" style="font-size:0.7rem; text-align:center; margin-top:8px; font-weight:800; min-height:12px;"></p>
    </div>

    <p class="footer-note">BAŞÖĞRETMEN MUZAFFER ÇINAR<br>İSG UZMANI & TSE TETKİK GÖREVLİSİ</p>
  </div>

  <script>
    const checklist = [
      { id: "A1", text: "Koridor ve merdivenlerde yığılma kontrolü yapıldı" },
      { id: "A2", text: "Teneffüste riskli öğrenci davranışları gözlenmedi" },
      { id: "A3", text: "Acil çıkış ve tahliye güzergahları açık" },
      { id: "B1", text: "Giriş-çıkış ve ziyaretçi kayıt protokolü uygun" },
      { id: "C1", text: "Islak zemin uyarı levhaları yerleştirildi" },
      { id: "C2", text: "Okul bahçesi fiziksel risk kontrolü yapıldı" }
    ];

    const logoKey = "isg_pro_logo";
    const counterKey = "isg_pro_counter";

    function message(t, isErr = false) {
      const el = document.getElementById("msg");
      el.textContent = t; el.style.color = isErr ? "var(--bad)" : "var(--ok)";
      setTimeout(() => el.textContent = "", 3000);
    }

    function checkLicense() {
      const val = document.getElementById("okul").value;
      const list = document.getElementById("list-area");
      const lock = document.getElementById("license-lock");
      if(val === "LOCKED") {
        list.style.display = "none";
        lock.style.display = "block";
      } else {
        list.style.display = "block";
        lock.style.display = "none";
      }
    }

    function getLicenseInfo() {
      alert("Lisans Anahtarı Bilgisi:\n\nKurum bazlı lisansınız bulunmamaktadır. Lütfen yönetici ile iletişime geçerek lisans anahtarınızı tanımlatınız.");
    }

    function renderList() {
      const area = document.getElementById("list-area");
      area.innerHTML = "<h2>Kontrol Maddeleri</h2>";
      checklist.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <p class="item-title">${item.id} - ${item.text}</p>
          <div class="status">
            <input type="radio" name="st_${item.id}" id="ok_${item.id}" value="Uygun" class="st-ok">
            <label for="ok_${item.id}">Uygun</label>
            <input type="radio" name="st_${item.id}" id="wr_${item.id}" value="Gözlem" class="st-wr">
            <label for="wr_${item.id}">Gözlem</label>
            <input type="radio" name="st_${item.id}" id="bd_${item.id}" value="Uygun Değil" class="st-bd">
            <label for="bd_${item.id}">U. Değil</label>
          </div>
          <textarea id="not_${item.id}" style="width:100%; min-height:40px; border-radius:8px; border:1px solid #d1d5db; padding:8px;" placeholder="Not ekleyin..."></textarea>
        `;
        area.appendChild(div);
      });
    }

    function saveData() {
      if(document.getElementById("okul").value === "LOCKED") return message("Lisanssız kurum kaydedilemez!", true);
      let count = parseInt(localStorage.getItem(counterKey) || 0) + 1;
      localStorage.setItem(counterKey, count);
      document.getElementById("reportCount").textContent = count;
      message("Veriler kaydedildi.");
    }

    function copyToClipboard() {
      message("Rapor kopyalandı.");
    }

    function shareReport() {
      const val = document.getElementById("okul").value;
      if(val === "LOCKED" || !val) return message("Lütfen kurum seçin!", true);
      alert("Rapor paylaşılıyor...");
    }

    function exportCSV() {
      message("Excel dosyası hazırlanıyor...");
    }

    function resetForm() {
      if(confirm("Sıfırlansın mı?")) location.reload();
    }

    function removeLogo() {
      if(confirm("Logo silinsin mi?")) { localStorage.removeItem(logoKey); location.reload(); }
    }

    document.getElementById("logoInput").onchange = (e) => {
      const reader = new FileReader();
      reader.onload = () => { 
        document.getElementById("logoPreview").src = reader.result; 
        document.getElementById("logoPreview").style.display="block"; 
        document.getElementById("logoPlaceholder").style.display="none"; 
        localStorage.setItem(logoKey, reader.result);
      };
      reader.readAsDataURL(e.target.files[0]);
    };

    window.onload = () => {
      renderList();
      document.getElementById("tarih").value = new Date().toISOString().slice(0, 10);
      document.getElementById("reportCount").textContent = localStorage.getItem(counterKey) || 0;
      const savedLogo = localStorage.getItem(logoKey);
      if(savedLogo) {
        document.getElementById("logoPreview").src = savedLogo;
        document.getElementById("logoPreview").style.display="block";
        document.getElementById("logoPlaceholder").style.display="none";
      }
    };
  </script>
</body>
</html>
